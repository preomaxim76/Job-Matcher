{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block page_css %}<link rel="stylesheet" href="/static/css/login.css">{% endblock %}

{% block main %}

    <div class="login_island">
        <h1>Log In</h1>
        <form action="/login" method="POST">
            <input type="text" name="username" class="login_input" placeholder="Username" autofocus autocomplete="off" required>
            <div class="password">
                <input type="password" name="password" class="login_input" placeholder="Password" autofocus autocomplete="off" required>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>

{% endblock %}
